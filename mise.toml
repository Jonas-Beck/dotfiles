[settings]
dotfiles.root = "~/.dotfiles"
experimental = true
auto_update = true


[dotfiles]
"~/.config/mise/config.toml" = "~/dotfiles/mise.toml"
"~/.config/lazygit/config.yml" = "~/dotfiles/lazygit/config.yml"
"~/.config/starship.toml" = "~/dotfiles/starship/starship.toml"
"~/.config/alacritty/alacritty.toml" = "~/dotfiles/alacritty/alacritty.toml"
"~/.config/k9s/" = "~/dotfiles/k9s/"
"~/.config/sofka/" = "~/dotfiles/sofka/"
"~/.tmux.conf" = "~/dotfiles/tmux/.tmux.conf"
"~/.config/karabiner/karabiner.json" = "~/dotfiles/karabiner/karabiner.json"
"~/.config/nvim/" = "~/dotfiles/nvim/"
"~/.gitconfig" = "~/dotfiles/git/.gitconfig"
"~/.gitignore" = "~/dotfiles/git/.gitignore"
"~/Developer/VELUX/.gitconfig" = "~/dotfiles/git/.gitconfig_work"
"~/.config/zsh/" = "~/dotfiles/zsh/zsh/"
"~/.zshrc" = "~/dotfiles/zsh/.zshrc"
"~/var/run/docker.sock" = "~/.config/colima/default/docker.sock"


[bootstrap.repos]
"~/dotfiles" = { url = "https://github.com/Jonas-Beck/dotfiles" }


[tasks.bootstrap]
description = "Install Tmux Plugins"
run = "tpack install"

[tools]
actionlint = "latest"
crane = "latest"
flux2 = "latest"
"github:Azure/kubelogin" = "latest"
"github:nklmilojevic/sofka" = "latest"
"github:tmuxpack/tpack" = "latest"
kustomize = "latest"
"npm:actions-up" = "latest"
zizmor = "latest"

# TODO: Seperate macos specific configs into dedicated files - currently waiting for this to be opt-out in Mise v2027.6.0

[bootstrap.brew]
adopt = true

[bootstrap.packages]
"brew:docker" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:git" = "latest"
"brew:helm" = "latest"
"brew:k9s" = "latest"
"brew:kind" = "latest"
"brew:lazygit" = "latest"
"brew:neovim" = "latest"
"brew:ripgrep" = "latest"
"brew:sesh" = "latest"
"brew:starship" = "latest"
"brew:tmux" = "latest"
"brew:tree-sitter-cli" = "latest"
"brew:yq" = "latest"
"brew:zoxide" = "latest"
"brew:bat" = "latest"
"brew:colima" = "latest"
"brew:kubernetes-cli" = "latest"
"brew:direnv" = "latest"
"brew-cask:copilot-cli" = "latest"
"brew-cask:alacritty" = "latest"
"brew-cask:arc" = "latest"
"brew-cask:bruno" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"
"brew-cask:gitify" = "latest"
"brew-cask:karabiner-elements" = "latest"
"brew-cask:keymapp" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:rectangle" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:visual-studio-code" = "latest"
[bootstrap.hooks]
pre-packages = [
  '''
#!/usr/bin/env bash
set -euo pipefail

if [ -x /opt/homebrew/bin/brew ] || command -v brew >/dev/null 2>&1; then
	echo "Homebrew already installed; skipping"
	exit 0
fi

echo "Installing Homebrew..."
/bin/bash -c \
	"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
''',
]

[bootstrap.macos.dock]
autohide = true
orientation = "bottom"
tilesize = 80

[bootstrap.macos.trackpad]
tap_to_click = true
